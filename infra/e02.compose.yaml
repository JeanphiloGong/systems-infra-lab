services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: e02
      POSTGRES_PASSWORD: e02_local_only
      POSTGRES_DB: e02
    ports:
      - "127.0.0.1:55451:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e02 -d e02"]
      interval: 2s
      timeout: 3s
      retries: 20
