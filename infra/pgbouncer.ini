[databases]
systems_lab = host=postgres port=5432 dbname=systems_lab

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 1
reserve_pool_size = 0
max_client_conn = 20
query_wait_timeout = 5
server_reset_query = DISCARD ALL
server_reset_query_always = 1
admin_users = systems_lab
