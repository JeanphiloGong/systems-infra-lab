[project]
name = "systems-infra-lab"
version = "0.1.0"
description = "Executable database and distributed systems tutorials"
requires-python = ">=3.12"
dependencies = [
    "psycopg-pool>=3.2,<4",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
markers = ["postgres: requires the isolated Systems Infra Lab PostgreSQL instance"]
